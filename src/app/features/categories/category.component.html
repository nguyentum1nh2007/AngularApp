<div style="padding: 20px; max-width: 650px;">
    <h2>Quản Lý Danh Mục</h2>

    <!-- FORM THÊM DANH MỤC -->
    <div style="margin-bottom: 20px;">
        <div style="display: flex; align-items: flex-start;">
            <div>
                <input [(ngModel)]="newCategoryName" (input)="clearAddError()" placeholder="Nhập tên danh mục..."
                    style="padding: 8px; width: 250px; margin-right: 10px;"
                    [style.border-color]="addError ? 'red' : '#ccc'" />
                <!-- Thông báo lỗi hiển thị ngay dưới ô Input -->
                <div *ngIf="addError" style="color: red; font-size: 13px; margin-top: 5px;">
                    {{ addError }}
                </div>
            </div>
            <button (click)="addCategory()" style="padding: 8px 15px; cursor: pointer;">Thêm Mới</button>
        </div>
    </div>

    <!-- BẢNG DANH SÁCH -->
    <table border="1" cellPadding="8" style="border-collapse: collapse; width: 100%;">
        <thead>
            <tr style="background-color: #f2f2f2;">
                <th style="width: 170px;">Mã (ID)</th>
                <th>Tên Danh Mục</th>
                <th style="width: 140px;">Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let cat of categories">
                <td>{{ cat.id }}</td>

                <!-- TRẠNG THÁI SỬA -->
                <td *ngIf="editingId === cat.id">
                    <input [(ngModel)]="editingName" (input)="clearEditError()" style="padding: 4px; width: 90%;"
                        [style.border-color]="editError ? 'red' : '#ccc'" />
                    <!-- Thông báo lỗi hiển thị ngay dưới ô Input Sửa -->
                    <div *ngIf="editError" style="color: red; font-size: 13px; margin-top: 5px;">
                        {{ editError }}
                    </div>
                </td>

                <!-- TRẠNG THÁI XEM -->
                <td *ngIf="editingId !== cat.id">
                    {{ cat.name }}
                </td>

                <!-- CỘT HÀNH ĐỘNG -->
                <td>
                    <ng-container *ngIf="editingId === cat.id">
                        <button (click)="saveEdit()"
                            style="color: green; font-weight: bold; margin-right: 5px;">Lưu</button>
                        <button (click)="cancelEdit()">Hủy</button>
                    </ng-container>

                    <ng-container *ngIf="editingId !== cat.id">
                        <button (click)="startEdit(cat)" style="margin-right: 5px;">Sửa</button>
                        <button (click)="deleteCategory(cat.id)" style="color: red;">Xóa</button>
                    </ng-container>
                </td>
            </tr>

            <tr *ngIf="categories.length === 0">
                <td colspan="3" style="text-align: center;">Chưa có danh mục nào.</td>
            </tr>
        </tbody>
    </table>
</div>
